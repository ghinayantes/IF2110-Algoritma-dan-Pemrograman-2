<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Target Cicilan Belajar UTS (Copy)</title><link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&amp;family=Libre+Franklin:wght@400;600;700&amp;display=swap"><style id="style">
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F7F8FA;--surface:#FFFFFF;--ink:#16243A;--muted:#5E6B7E;--line:#E1E5EC;--accent:#1F3A5F;--exam:#B3261E;
--done:#E3F1E5;--doneInk:#1E6B34;--mvs:#E6EEFB;--mvsInk:#24508F;--late:#FBE7E6;--lateInk:#9A2A22;--buf:#FFF5DA;
--os:#3D5A80;--alpro:#6A4C93;--prob:#2A7F62;--algeo:#B5651D;--rpl:#8A3B5E;--sos:#4F6D7A;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151D;--surface:#18202B;--ink:#E7ECF3;--muted:#9AA6B6;--line:#2A3442;--accent:#8FB3E0;--exam:#F2A29C;
--done:#1D3526;--doneInk:#9BD8AC;--mvs:#1D2B42;--mvsInk:#A9C4EE;--late:#3A2020;--lateInk:#F2A9A3;--buf:#3A3220;
--os:#8FA9CF;--alpro:#B9A0DC;--prob:#7FC9AE;--algeo:#E3A56B;--rpl:#D793B1;--sos:#9DBAC6;}}
:root[data-theme="dark"]{--bg:#10151D;--surface:#18202B;--ink:#E7ECF3;--muted:#9AA6B6;--line:#2A3442;--accent:#8FB3E0;--exam:#F2A29C;
--done:#1D3526;--doneInk:#9BD8AC;--mvs:#1D2B42;--mvsInk:#A9C4EE;--late:#3A2020;--lateInk:#F2A9A3;--buf:#3A3220;
--os:#8FA9CF;--alpro:#B9A0DC;--prob:#7FC9AE;--algeo:#E3A56B;--rpl:#D793B1;--sos:#9DBAC6;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:clamp(26px,4vw,38px);line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px;max-width:70ch}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.tabs button{border:0;background:none;color:var(--ink);padding:8px 16px;font:inherit;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:10px;font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.saving{color:var(--muted);font-size:13px}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:28px}
.course{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px}
.course b{display:block}
.course small{color:var(--muted)}
.meter{height:5px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--c)}
.day{margin-bottom:26px}
.dayhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:8px 0;border-bottom:2px solid var(--ink);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.dayhead h2{font-family:"Fraunces",Georgia,serif;font-size:21px;margin:0;font-weight:600}
.dayhead .exam{color:var(--exam);font-weight:700}
.dayhead .meta{color:var(--muted);font-size:13px;margin-left:auto}
.row{display:grid;grid-template-columns:130px minmax(0,1.1fr) minmax(0,1.6fr) minmax(0,1.1fr) 70px 128px;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.row.buf{background:var(--buf);padding-left:10px;padding-right:10px;border-radius:6px}
.row[data-s="Selesai"]{background:var(--done)}
.row[data-s="MVS saja"]{background:var(--mvs)}
.row[data-s="Tertunda"]{background:var(--late)}
.row[data-s]:not([data-s="Belum"]){padding-left:10px;padding-right:10px;border-radius:6px}
.mk{font-weight:700;color:var(--c)}
.h{display:block;font-size:13px;color:var(--muted)}
.bab{font-weight:600;white-space:pre-line}
.nor{white-space:pre-line;color:var(--ink)}
.mvs{font-size:14px;border-left:2px solid var(--line);padding-left:10px}
.mvs em{display:block;font-style:normal;color:var(--muted);font-size:12px}
.jam{font-variant-numeric:tabular-nums;text-align:right}
select{width:100%;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.colhead{display:grid;grid-template-columns:130px minmax(0,1.1fr) minmax(0,1.6fr) minmax(0,1.1fr) 70px 128px;gap:14px;font-size:12px;color:var(--muted);padding:4px 0 0}
.surv section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-bottom:14px;max-width:780px}
.surv h2{font-family:"Fraunces",Georgia,serif;font-size:19px;margin:0 0 8px}
.surv ol,.surv ul{margin:0;padding-left:20px}.surv li{margin:4px 0}
.ro{font-size:13px;color:var(--muted)}
@media (max-width:820px){.colhead{display:none}.row{grid-template-columns:1fr 1fr;gap:8px 12px}
.row .c-bab,.row .c-nor,.row .c-mvs{grid-column:1/-1}.jam{text-align:left}.row .c-st{grid-column:2;grid-row:1}.row .c-jam{grid-column:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div><script type="application/json" id="data">{"rows": [{"d": 1, "ex": "", "mk": "OS", "h": "H-11", "bab": "Bab 1 Introduction\nBab 2 OS Structures", "nor": "Interrupt, hierarki storage, DMA, dual mode dan timer.\nJenis system call, API vs syscall, linker dan loader.\nStruktur monolitik, layered, microkernel, modules, hybrid, proses boot.", "mvs": "Rangkum dual mode, jenis syscall, dan perbandingan struktur OS dalam satu halaman.", "mm": 30, "jam": 1.5}, {"d": 1, "ex": "", "mk": "Probstat", "h": "H-12", "bab": "Bab 2 Teori Peluang", "nor": "Ruang sampel, permutasi dan kombinasi, aturan penjumlahan dan perkalian.\nPeluang bersyarat, kejadian saling bebas, total probability, Teorema Bayes.\nKerjakan 6 sampai 8 soal.", "mvs": "Tulis rumus Bayes dan total probability, lalu kerjakan 2 soal.", "mm": 30, "jam": 1.5}, {"d": 1, "ex": "", "mk": "Alpro 2", "h": "H-12", "bab": "Pengantar Fungsional\nADT Fungsional", "nor": "Tipe dasar, type signature, pattern matching, guard, where dan let.\nADT dengan tuple atau data: konstruktor, selektor, predikat.\nKerjakan 3 soal sampai compile di GHC.", "mvs": "Satu soal ADT sampai compile tanpa error.", "mm": 30, "jam": 1}, {"d": 2, "ex": "", "mk": "OS", "h": "H-10", "bab": "Bab 3 Processes", "nor": "State proses, PCB, context switch, antrean scheduler.\nfork, exec, wait, proses zombie dan orphan.\nIPC shared memory (producer-consumer) vs message passing, pipe, socket, RPC.", "mvs": "Gambar diagram state proses dan tebak jumlah proses dari satu potongan kode fork().", "mm": 30, "jam": 1.5}, {"d": 2, "ex": "", "mk": "Alpro 2", "h": "H-11", "bab": "Analisis Rekurens\nList Linier", "nor": "Menentukan basis dan rekurens dengan benar.\nFungsi list dasar dengan rekursi murni tanpa fungsi bawaan: panjang, elemen ke-n, konkat, reverse, search, insert terurut.", "mvs": "Tiga fungsi list rekursif.", "mm": 40, "jam": 2}, {"d": 2, "ex": "", "mk": "Sosfor", "h": "H-13", "bab": "SP-1 Social Context\nSP-2 Analytical Tools", "nor": "Kerangka analisis etika: utilitarianisme, deontologi, etika kebajikan, kontrak sosial.\nDampak sosial komputasi.", "mvs": "Satu kartu hafalan untuk setiap teori etika.", "mm": 20, "jam": 0.5}, {"d": 3, "ex": "", "mk": "OS", "h": "H-9", "bab": "Bab 4 Threads\nBab 5 CPU Scheduling", "nor": "Model many-to-one, one-to-one, many-to-many, Amdahl's law, thread pool, fork-join, isu threading.\nKriteria penjadwalan: turnaround, waiting, response time.\nFCFS, SJF, SRTF, Priority, RR, multilevel queue, MLFQ.\nKerjakan 4 soal Gantt chart.", "mvs": "Dua soal Gantt (SRTF dan RR) lengkap dengan waiting time dan turnaround time.", "mm": 45, "jam": 2.5}, {"d": 3, "ex": "", "mk": "Probstat", "h": "H-10", "bab": "Bab 3 Peubah Acak", "nor": "pmf, pdf, CDF.\nDistribusi gabungan diskrit dan kontinu, distribusi marginal dan bersyarat, uji kebebasan statistik.\nKerjakan 6 soal.", "mvs": "Satu soal marginal dari tabel gabungan dan satu soal integral pdf.", "mm": 45, "jam": 2}, {"d": 4, "ex": "", "mk": "Alpro 2", "h": "H-9", "bab": "List of List\nHigh-Order Function", "nor": "Rekursi dengan pembedaan atom vs list.\nmap, filter, foldl, foldr, lambda, komposisi fungsi.\nUbah 3 fungsi rekursif menjadi versi fold.", "mvs": "Satu soal rekursi List of List dan satu soal dengan foldr.", "mm": 40, "jam": 2}, {"d": 4, "ex": "", "mk": "Probstat", "h": "H-9", "bab": "Bab 4 Harapan Matematik", "nor": "E[X], E[g(X)], Var = E[X²] − μ².\nKovariansi dan koefisien korelasi.\nMean dan variansi kombinasi linear, Teorema Chebyshev.\nKerjakan 6 soal.", "mvs": "Tulis 5 rumus inti dan kerjakan 2 soal Var(aX + bY).", "mm": 30, "jam": 2}, {"d": 4, "ex": "", "mk": "Algeo", "h": "H-10", "bab": "Topik 1 dan 2\nMatriks, SPL, Gauss dan Gauss-Jordan", "nor": "Bentuk eselon baris vs eselon baris tereduksi.\nTiga kemungkinan solusi SPL, termasuk SPL dengan parameter.\nInvers dengan reduksi [A | I].", "mvs": "Satu SPL 3x3 sampai eselon baris tereduksi.", "mm": 20, "jam": 1}, {"d": 5, "ex": "", "mk": "OS", "h": "H-7", "bab": "Bab 6 Synchronization Tools", "nor": "Race condition, tiga syarat solusi critical section (mutual exclusion, progress, bounded waiting).\nPeterson, test_and_set, compare_and_swap.\nMutex, semaphore (counting vs binary), monitor dan condition variable.\nLiveness: deadlock, starvation, priority inversion.", "mvs": "Tulis tiga syarat critical section, jelaskan mengapa Peterson memenuhinya, lalu trace satu kode semaphore.", "mm": 45, "jam": 2}, {"d": 5, "ex": "", "mk": "Algeo", "h": "H-9", "bab": "Topik 2 (lanjutan)\nTopik 3 Determinan", "nor": "Matriks elementer dan hubungannya dengan invers.\nDeterminan dengan OBE (efek tiap jenis OBE), ekspansi kofaktor.\nSifat det(AB), det(Aᵀ), det(A⁻¹).\nCek di slide apakah Aturan Cramer masuk.", "mvs": "Satu determinan 4x4 dengan OBE dan satu dengan kofaktor.", "mm": 45, "jam": 1.5}, {"d": 6, "ex": "", "mk": "Probstat", "h": "H-7", "bab": "Bab 5 Distribusi Diskrit Khusus", "nor": "Seragam, binomial, multinomial, hipergeometrik, binomial negatif, geometrik, Poisson.\nBuat tabel \"ciri cerita soal → distribusi\".", "mvs": "Tabel ciri distribusi 7 baris dan 2 soal.", "mm": 45, "jam": 2}, {"d": 6, "ex": "", "mk": "Alpro 2", "h": "H-7", "bab": "Binary Tree", "nor": "Konstruktor dan selektor pohon.\nJumlah elemen, jumlah daun, tinggi pohon.\nTraversal preorder, inorder, postorder.\nBST (search dan insert), fold pada pohon.", "mvs": "Dua fungsi pohon rekursif dan satu traversal.", "mm": 45, "jam": 1.5}, {"d": 6, "ex": "", "mk": "BUFFER", "h": "Buffer 1", "bab": "Utang 1 sampai 5 Okt", "nor": "Kerjakan blok yang tertunda. Kalau tidak ada utang, pakai untuk istirahat.", "mvs": "Tidak ada.", "mm": 0, "jam": 1}, {"d": 7, "ex": "", "mk": "OS", "h": "H-5", "bab": "Bab 7 Synchronization Examples\nBab 8 Deadlocks", "nor": "Bounded-buffer, readers-writers, dining philosophers dengan semaphore.\nEmpat syarat deadlock dan resource-allocation graph.\nPrevention vs avoidance.\nBanker's Algorithm (safety dan resource-request), deteksi, recovery.\nKerjakan 2 soal Banker.", "mvs": "Satu soal Banker sampai ketemu safe sequence, lalu hafalkan empat syarat deadlock.", "mm": 50, "jam": 3}, {"d": 7, "ex": "", "mk": "Sosfor", "h": "H-8", "bab": "SP-3 Professional Ethics\nSP-4 Intellectual Property", "nor": "Kode etik ACM/IEEE, whistleblowing.\nHak cipta, paten, merek, rahasia dagang.\nLisensi open source copyleft vs permissive.", "mvs": "Tabel perbandingan 4 jenis HKI.", "mm": 20, "jam": 0.5}, {"d": 8, "ex": "", "mk": "Probstat", "h": "H-5", "bab": "Bab 6 Distribusi Kontinu Khusus", "nor": "Seragam kontinu, normal dan tabel z.\nHampiran normal terhadap binomial dengan koreksi kontinuitas.\nGamma, eksponensial (sifat memoryless), chi-square.", "mvs": "Tiga soal tabel z dan satu soal hampiran normal.", "mm": 45, "jam": 2}, {"d": 8, "ex": "", "mk": "Algeo", "h": "H-6", "bab": "Topik 4 Vektor di Ruang Euclidean", "nor": "Norma, vektor satuan, jarak.\nDot product, sudut, proyeksi ortogonal, Cauchy-Schwarz.\nKombinasi linier, cosine similarity untuk temu balik informasi.\nCross product: luas jajargenjang, volume dengan triple product.", "mvs": "Satu soal cosine similarity dan satu cross product beserta luasnya.", "mm": 30, "jam": 1.5}, {"d": 9, "ex": "", "mk": "Alpro 2", "h": "H-4", "bab": "Latihan Campuran (Simulasi)", "nor": "Empat soal cerita campuran (list, List of List, HOF, tree).\nKerjakan dengan timer seperti ujian dan compile semuanya.", "mvs": "Dua soal dengan timer.", "mm": 45, "jam": 2}, {"d": 9, "ex": "", "mk": "RPL", "h": "H-5", "bab": "Bagian 1 Proses\nBagian 2 Requirements", "nor": "Waterfall, iterative, Scrum/Agile, dan kapan masing-masing cocok.\nSCM: version control, baseline, change control, etika.\nFR vs NFR, teknik elisitasi, use case dan skenario, SKPL, validasi requirement.", "mvs": "Tabel perbandingan model proses serta contoh 2 FR dan 2 NFR.", "mm": 30, "jam": 1.5}, {"d": 9, "ex": "", "mk": "Sosfor", "h": "H-6", "bab": "SP-5 Privacy\nSP-6 Professional Communication", "nor": "Privasi informasi, surveillance, UU PDP (kalau dibahas di kelas).\nPrinsip komunikasi teknis yang baik.", "mvs": "Ringkasan satu halaman tentang privasi.", "mm": 15, "jam": 0.5}, {"d": 10, "ex": "", "mk": "OS", "h": "H-2", "bab": "Latihan Soal Gabungan", "nor": "Soal tahun lalu atau latihan: Gantt untuk semua algoritma, trace semaphore, Banker, konsep Bab 1 sampai 4.", "mvs": "Satu Gantt RR dan satu soal Banker.", "mm": 45, "jam": 2.5}, {"d": 10, "ex": "", "mk": "Algeo", "h": "H-4", "bab": "Topik 5 Ruang Vektor Umum (bagian pertama)", "nor": "Sepuluh aksioma ruang vektor, contoh himpunan yang gagal aksioma.\nUji subruang (tertutup terhadap penjumlahan dan perkalian skalar).\nBebas linier dan span.", "mvs": "Dua soal uji subruang.", "mm": 30, "jam": 2}, {"d": 10, "ex": "", "mk": "RPL", "h": "H-4", "bab": "Bagian 3 Pemodelan & Perancangan", "nor": "Use case, activity, dan class diagram (asosiasi, agregasi, komposisi, generalisasi, multiplicity).\nCoupling dan cohesion.\nGaya arsitektur: layered, client-server, MVC.", "mvs": "Gambar satu class diagram kecil dari studi kasus.", "mm": 15, "jam": 1}, {"d": 11, "ex": "", "mk": "OS", "h": "H-1", "bab": "Review Ringan", "nor": "Baca ulang catatan sendiri.\nCheat sheet rumus scheduling, empat syarat deadlock, syarat critical section.\nTidak ada materi baru.", "mvs": "Baca cheat sheet.", "mm": 30, "jam": 2}, {"d": 11, "ex": "", "mk": "Probstat", "h": "H-2", "bab": "Latihan Identifikasi Distribusi", "nor": "Sepuluh soal cerita campuran Bab 2 sampai 6.\nTebak distribusi dan parameternya dulu, baru hitung.", "mvs": "Empat soal, cukup identifikasi distribusi dan parameternya.", "mm": 30, "jam": 1.5}, {"d": 11, "ex": "", "mk": "BUFFER", "h": "Buffer 2", "bab": "Utang minggu ini", "nor": "Selesaikan blok yang tertunda. Kalau sudah bersih, tidur siang atau olahraga ringan.\nTidur paling lambat 22.30.", "mvs": "Tidak ada.", "mm": 0, "jam": 2}, {"d": 12, "ex": "UJIAN OS", "mk": "Alpro 2", "h": "H-1", "bab": "Review & Simulasi", "nor": "Istirahat 1 sampai 2 jam setelah ujian.\nDua soal simulasi, review pola rekursi pohon dan fold.", "mvs": "Satu soal tree dan baca ulang pola fold.", "mm": 40, "jam": 2}, {"d": 12, "ex": "UJIAN OS", "mk": "Probstat", "h": "H-1", "bab": "Review Rumus", "nor": "Rangkum dalam satu lembar: mean dan variansi tiap distribusi, Bayes, Chebyshev.\nKerjakan 4 soal.", "mvs": "Baca lembar rumus.", "mm": 30, "jam": 1.5}, {"d": 13, "ex": "UJIAN Alpro 2 & Probstat", "mk": "Algeo", "h": "H-1", "bab": "Topik 5 (bagian kedua)\nLatihan OBE", "nor": "Basis dan dimensi.\nCek kebebasan linier dengan determinan atau OBE.\nBasis ruang solusi SPL homogen.\nSatu soal OBE sebagai pemanasan.", "mvs": "Satu soal basis ruang solusi.", "mm": 40, "jam": 2}, {"d": 13, "ex": "UJIAN Alpro 2 & Probstat", "mk": "RPL", "h": "H-1", "bab": "Bagian 4 Konstruksi & Pengujian\nReview Diagram", "nor": "Coding standard dan construction tools.\nVerifikasi vs validasi.\nLevel testing (unit, integrasi, sistem, penerimaan), black box vs white box.\nReview ulang diagram dari 10 Okt.", "mvs": "Hafalkan beda verifikasi dan validasi serta level testing.", "mm": 20, "jam": 1}, {"d": 14, "ex": "UJIAN Algeo & RPL", "mk": "Sosfor", "h": "H-1", "bab": "SP-7, SP-9, SP-11, SP-13\nReview", "nor": "Sustainability (e-waste, jejak energi).\nEkonomi komputasi (efek jaringan, dominasi platform, gig economy).\nDinamika kelompok (groupthink, tahapan Tuckman), teamwork.\nSatu latihan esai studi kasus memakai kerangka etika SP-2.", "mvs": "Susun kerangka esai: stakeholder, dua teori etika, rekomendasi.", "mm": 40, "jam": 2.5}], "survival": [["Buffer time", ["Buffer resmi ada dua: 1 jam pada Selasa 6 Okt dan 2 jam pada Minggu 11 Okt. Sisa hari Sabtu 3 Okt jadi cadangan tidak resmi.", "Keduanya ditaruh sebelum ujian OS karena materinya delapan bab, ujiannya paling awal, dan setelah itu tidak ada waktu mengejar.", "Blok tertunda hanya boleh dipindah ke buffer. Jangan ke jam tidur, dan jangan tambahkan lebih dari satu blok pindahan ke hari normal."]], ["Triage saat hari hancur", ["Kerjakan semua MVS di tanggal itu. Totalnya paling lama 90 menit.", "Kalau waktunya kurang, kerjakan hanya MVS untuk mata kuliah yang ujiannya paling dekat.", "Kalau cuma sanggup 25 menit karena capek, kerjakan 25 menit lalu tidur. Tandai statusnya \"MVS saja\" dan itu tetap dihitung."]], ["Kalau dua hari berturut-turut hancur, korbankan sesuai urutan", ["Sesi Sosfor 2 dan 9 Oktober (dikejar pada 14 Oktober).", "Detail Bab 1 sampai 2 OS di luar ringkasan satu halaman.", "Detail Bab 7 OS di luar tiga masalah klasik.", "Kedalaman multinomial dan chi-square di Probstat.", "RPL Bagian 4."]], ["Jangan pernah dikorbankan", ["OS: scheduling, semaphore, dan Banker.", "Probstat: Bayes dan identifikasi distribusi.", "Alpro 2: rekursi tree dan fold. Kalau belum menulis dan compile sendiri, MVS Alpro hari itu belum selesai.", "Algeo: OBE dan Topik 5 (Ruang Vektor Umum)."]], ["Cek ke dosen atau asisten", ["Alpro 2: jadwal ini mengasumsikan UTS hanya bagian fungsional (Haskell).", "RPL: apakah Bagian 4 (konstruksi dan testing) sudah diajarkan.", "Algeo: apakah Aturan Cramer masuk.", "Sosfor: apakah UU PDP dibahas di kelas."]]]}</script><script type="application/json" id="state">{}</script><script type="application/octet-stream" id="xlsx">UEsDBBQACAgIAINtPl0AAAAAAAAAAAAAAAAaAAAAeGwvX3JlbHMvd29ya2Jvb2sueG1sLnJlbHO9k0FuwjAQRfecwpp94yS0qKrisKmQ2AI9gOVM4ojEtuyhhdvXlKoECUVdRKys+fb8/2TNFMtj37FP9KG1RkCWpMDQKFu1phHwsVs9vcKynBUb7CTFJ0G3LrDYY4IATeTeOA9KYy9DYh2aeFNb30uKpW+4k2ovG+R5mi64H3pAeePJ1pUAv64yYLuTw/9427puFb5bdejR0J0ITrEXo6H0DZKAn/IiZkk0A36fIZ+SIdCpw3CFuNRj8fMp47+s3weNSFeCPynCnY/Rv3h+MEw+BvPyYJj5GMxi0inR0mO1JR/XbjgsQ/kXZlbwm2UsvwFQSwcIKcAJbfAAAADDAwAAUEsDBBQACAgIAINtPl0AAAAAAAAAAAAAAAAPAAAAeGwvd29ya2Jvb2sueG1sjVPbctowEH3vV7gaXsE2txAGk6EQmmR6m5Amj5m1tY5VZImRZCDt9N+7tjElbSfTB7B2Vzp7ds/u5GKfS2+LxgqtIhZ2AuahSjQX6iliX++W7RHzrAPFQWqFEXtGyy6mbyY7bdax1muP3isbscy5zdj3bZJhDrajN6gokmqTgyPTPPl2YxC4zRBdLv1uEAz9HIRiNcLY/A+GTlOR4EInRY7K1SAGJThibzOxsWw6SYXE+7ogDzab       var r=D.rows[i];var row=el('div','row'+(r.mk==='BUFFER'?' buf':''));row.setAttribute('data-s',st(i));
      row.style.setProperty('--c','var('+COL[r.mk]+')');
      var a=el('div','c-mk');a.appendChild(el('span','mk',r.mk==='BUFFER'?'Buffer':r.mk));a.appendChild(el('span','h',r.h));row.appendChild(a);
      row.appendChild(el('div','bab c-bab',r.bab));
      row.appendChild(el('div','nor c-nor',r.nor));
      var m=el('div','mvs c-mvs');m.appendChild(el('em',null,r.mm?('MVS, '+r.mm+' menit'):'MVS'));m.appendChild(document.createTextNode(r.mvs));row.appendChild(m);
      row.appendChild(el('div','jam c-jam',String(r.jam).replace('.',',')+' j'));
      var cst=el('div','c-st');var sel=el('select');sel.setAttribute('aria-label','Status '+r.mk+' '+dayName(d));sel.disabled=readOnly;
      OPTS.forEach(function(o){var op=el('option',null,o);op.value=o;if(o===st(i))op.selected=true;sel.appendChild(op)});
      sel.onchange=function(){if(sel.value==='Belum')delete S[i];else S[i]=sel.value;row.setAttribute('data-s',sel.value);schedule()};
      cst.appendChild(sel);row.appendChild(cst);sec.appendChild(row)});
    w.appendChild(sec)});
}
function renderSurv(w){
  var box=el('div','surv');
  D.survival.forEach(function(s,k){var sec=el('section');sec.appendChild(el('h2',null,s[0]));
    var list=el(k===2?'ol':'ul');s[1].forEach(function(t){list.appendChild(el('li',null,t))});sec.appendChild(list);box.appendChild(sec)});
  w.appendChild(box);
}
function schedule(){pending=true;var sv=document.getElementById('sv');if(sv)sv.textContent='Menyimpan…';clearTimeout(timer);timer=setTimeout(save,1500)}
function buildDoc(){
  var esc=function(s){return s.replace(/<\//g,'<\\/')};
  return '<!doctype html>\n<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'+
  '<title>Target Cicilan Belajar UTS</title>'+document.getElementById('fonts').outerHTML+
  '<style id="style">'+document.getElementById('style').textContent+'</style></head><body><div id="app"></div>'+
  '<script type="application/json" id="data">'+esc(document.getElementById('data').textContent)+'<\/script>'+
  '<script type="application/json" id="state">'+esc(JSON.stringify(S))+'<\/script>'+
  '<script type="application/octet-stream" id="xlsx">'+document.getElementById('xlsx').textContent+'<\/script>'+
  '<script id="app-script">'+document.getElementById('app-script').textContent+'<\/script></body></html>';
}
function save(){
  if(!art){pending=false;readOnly=true;render();return}
  art.publish(buildDoc()).then(function(){pending=false}).catch(function(e){
    pending=false;var c=e&&e.code;
    if(c==='conflict')return;
    if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'){readOnly=true;render();return}
    var sv=document.getElementById('sv');if(sv)sv.textContent='Gagal menyimpan. Ubah status sekali lagi untuk mencoba ulang.';
  });
}
var dlns=null;
function wireDownload(){var b=document.getElementById('dl');if(!b||!dlns)return;b.hidden=false;
  b.onclick=function(){var bin=atob(document.getElementById('xlsx').textContent.trim());var u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
    dlns.save({filename:'Target_Cicilan_UTS_Okt2026.xlsx',data:new Blob([u],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}).catch(function(){})}}
render();
if(window.claude&&window.claude.use){
  window.claude.use('artifact').then(function(a){art=a;if(!a){readOnly=true;render()}});
  window.claude.use('downloads').then(function(d){dlns=d;wireDownload()});
}else{readOnly=true;render()}
})();
</script></body></html>
